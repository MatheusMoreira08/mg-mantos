<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG Mantos | A Casa do Torcedor</title>
    <link rel="icon" type="image/png" href="img/front-page/logo.png">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="top-bar">FRETE GRÁTIS PARA TODO BRASIL <span>|</span> COMPRAS ACIMA DE R$ 199,90</div>

    <header>
        <div class="container header-main">
            <div class="logo-area">
                <button class="menu-btn" onclick="toggleSidebar()" aria-label="Abrir Menu">
                    <span class="material-icons-outlined">menu</span>
                </button>
                <a href="index.html" class="logo">
                    <img src="img/front-page/logo.png" alt="MG Mantos">
                    <span id="logo-text">MG <span>MANTOS</span></span>
                </a>
            </div>

            <div class="search-bar">
                <input type="text" placeholder="Buscar camisas...">
                <span class="material-icons-outlined search-icon">search</span>
            </div>

            <div class="header-actions">
                <div class="action-item" onclick="toggleTheme()" title="Mudar Tema">
                    <span class="material-icons-outlined" id="theme-icon">dark_mode</span>
                </div>
                <div class="action-item" onclick="openCartModal(false)" style="cursor: pointer; position: relative;">
                    <span class="material-icons-outlined">shopping_bag</span>
                    <span class="cart-count-badge" style="display: none;">0</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="slider-container">
            <div class="slider">
                <a href="categoria.html?tag=lancamento" class="slide fade">
                    <img src="./img/front-page/banner1.png" alt="Bem Vindo" fetchpriority="high">
                </a>
                <a href="categoria.html?tag=retro" class="slide fade"><img src="./img/front-page/banner2.png"
                        alt="Ídolos" loading="lazy"></a>
                <a href="categoria.html?tag=lancamento" class="slide fade"><img src="./img/front-page/banner3.png"
                        alt="Lançamento" loading="lazy"></a>
                <a href="#" class="slide fade"><img src="./img/front-page/banner4.png" alt="Frete" loading="lazy"></a>
                <a href="#" class="slide fade"><img src="./img/front-page/banner6.png" alt="Copa do Mundo"
                        loading="lazy"></a>
            </div>
            <a class="prev-hero" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next-hero" onclick="plusSlides(1)">&#10095;</a>
        </section>

        <div class="container main-content">

            <section class="categories-grid">
                <a href="categoria.html?tag=nacional" class="cat-card">
                    <img src="./img/front-page/nacional.png" alt="Nacionais">
                    <div class="cat-label">NACIONAIS</div>
                </a>
                <a href="categoria.html?tag=europeus" class="cat-card">
                    <img src="./img/front-page/europeu.jpg" alt="Europeus">
                    <div class="cat-label">EUROPEUS</div>
                </a>
                <a href="categoria.html?tag=selecoes" class="cat-card">
                    <img src="./img/front-page/selecoess.avif" alt="Seleções">
                    <div class="cat-label">SELEÇÕES</div>
                </a>
            </section>

            <section class="section-block">
                <div class="section-header">
                    <h2 class="section-title">Os Mais Vendidos</h2>
                    <a href="categoria.html?tag=destaque" class="section-link">VER TODOS</a>
                </div>
                <div class="carousel-wrapper">
                    <button class="carousel-btn btn-left"
                        onclick="scrollCarousel('grid-destaques', -1)">&#10094;</button>
                    <div class="carousel-track" id="grid-destaques"></div>
                    <button class="carousel-btn btn-right"
                        onclick="scrollCarousel('grid-destaques', 1)">&#10095;</button>
                </div>
            </section>

            <section class="categories-grid">
                <a href="categoria.html?tag=lancamento" class="cat-card">
                    <img src="./img/front-page/lancamento.webp" alt="Lançamentos">
                    <div class="cat-label">LANÇAMENTOS</div>
                </a>
                <a href="categoria.html?tag=feminina" class="cat-card">
                    <img src="./img/front-page/fem-marta.jpg" alt="Femininas">
                    <div class="cat-label">FEMININAS</div>
                </a>
                <a href="categoria.html?tag=internacional" class="cat-card">
                    <img src="./img/front-page/restodomundo.avif" alt="Resto do Mundo">
                    <div class="cat-label">RESTO DO MUNDO</div>
                </a>
            </section>

            <section class="section-block">
                <div class="section-header">
                    <h2 class="section-title">Lançamentos 26/27</h2>
                    <a href="categoria.html?tag=lancamento" class="section-link">VER TODOS</a>
                </div>
                <div class="carousel-wrapper">
                    <button class="carousel-btn btn-left"
                        onclick="scrollCarousel('grid-lancamentos', -1)">&#10094;</button>
                    <div class="carousel-track" id="grid-lancamentos"></div>
                    <button class="carousel-btn btn-right"
                        onclick="scrollCarousel('grid-lancamentos', 1)">&#10095;</button>
                </div>
            </section>

        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
