<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG Mantos | Detalhes do Produto</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container header-main">
            <div class="logo-area">
                <a href="index.html" class="logo">
                    <img src="img/front-page/logo.png" alt="MG Mantos" onerror="this.style.display='none'">
                    <span id="logo-text">MG <span>MANTOS</span></span>
                </a>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Buscar camisas...">
                <span class="material-icons-outlined search-icon">search</span>
            </div>
            <div class="header-actions">
                <div class="action-item" onclick="toggleTheme()"><span class="material-icons-outlined"
                        id="theme-icon">dark_mode</span></div>
                <div class="action-item" onclick="openCartModal(false)" style="position: relative;">
                    <span class="material-icons-outlined">shopping_bag</span>
                    <span class="cart-count-badge" style="display: none;">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container product-page">
        <div class="breadcrumb">
            <a href="index.html">Início</a> > <span id="bread-name">Produto</span>
        </div>

        <div class="product-container">
            <div class="product-gallery">
                <div class="main-image">
                    <button class="gallery-arrow prev" onclick="nextImage(-1)">&#10094;</button>
                    <img id="currentImg" src="" alt="Produto" fetchpriority="high" width="800" height="800">
                    <button class="gallery-arrow next" onclick="nextImage(1)">&#10095;</button>
                </div>
                <div class="thumbnails" id="thumb-container"></div>
            </div>

            <div class="product-details">
                <h1 class="p-title" id="prod-title">Carregando...</h1>
                <div class="p-prices">
                    <span class="current-price" id="prod-price">...</span>
                    <p class="payment-info">em até 3x sem juros</p>
                </div>

                <div class="p-selector">
                    <p>Tamanho:</p>
                    <div class="sizes">
                        <button class="size-btn" onclick="selectSize(this)">P</button>
                        <button class="size-btn" onclick="selectSize(this)">M</button>
                        <button class="size-btn" onclick="selectSize(this)">G</button>
                        <button class="size-btn" onclick="selectSize(this)">GG</button>
                    </div>
                </div>

                <div class="custom-box">
                    <p class="custom-title">Personalização +R$20,00 (Opcional):</p>
                    <div class="custom-inputs">
                        <input type="text" id="cust-name" placeholder="Nome" maxlength="12">
                        <input type="text" id="cust-number" placeholder="Nº" maxlength="2">
                    </div>
                </div>

                <button class="buy-btn">ADICIONAR AO CARRINHO</button>
            </div>
        </div>
    </main>

    <footer>
        <p class="copyright">&copy; 2026 MG Mantos.</p>
    </footer>

    <div id="cart-modal-overlay" class="modal-overlay" onclick="closeCartModal()"></div>
    <div id="cart-modal" class="modal-box">
        <div class="modal-header">
            <h3>Carrinho</h3>
            <span class="close-modal" onclick="closeCartModal()">&times;</span>
        </div>
        <div id="modal-cart-items" class="modal-body"></div>
        <div class="modal-footer">
            <div class="modal-total-row">
                <span>Total:</span>
                <span id="modal-total-price">R$ 0,00</span>
            </div>
            <button onclick="finalizeOrder()" class="btn-finalize" style="width: 100%;">Finalizar Compra</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
