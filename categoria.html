<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>MG Mantos | Categoria</title>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined&display=swap" rel="stylesheet">
    <link rel="icon" type="image/webp" href="img/front-page/logo.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@800&family=Oswald:wght@600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span id="logo-text">MG <span>MANTOS</span></span>
            <span class="material-icons-outlined" onclick="toggleSidebar()" style="cursor:pointer">close</span>
        </div>
        <nav class="sidebar-links">
            <a href="index.html"><span class="material-icons-outlined">home</span> Início</a>
            <a href="categoria.html?tag=nacional">Nacionais</a>
            <a href="categoria.html?tag=europeus">Europeus</a>
            <a href="categoria.html?tag=feminina">Femininas</a>
            <a href="categoria.html?tag=selecoes">Seleções</a>
            <a href="categoria.html?tag=retro">Retrô</a>
        </nav>
    </div>

    <div id="overlay" class="overlay" onclick="toggleSidebar()"></div>

    <header>
        <div class="container header-main">
            <div class="logo-area">
                <button class="menu-btn" onclick="toggleSidebar()">
                    <span class="material-icons-outlined">menu</span>
                </button>
                <a href="index.html" class="logo">
                    <img src="img/front-page/logo.png" width="45" alt="MG Mantos">
                    <span>MG <span>MANTOS</span></span>
                </a>
            </div>

            <div class="search-bar" style="position: relative;">
                <input type="text" id="inputBusca" placeholder="Buscar camisas..." autocomplete="off">
                <span class="material-icons-outlined search-icon">search</span>
                <div id="caixaResultados" class="search-results-box" style="display: none;"></div>
            </div>

            <div class="header-actions">
                <div class="action-item" onclick="toggleTheme()" title="Mudar Tema">
                    <span class="material-icons-outlined" id="theme-icon">dark_mode</span>
                </div>
                <div class="action-item" onclick="openCartModal(false)" style="position: relative;">
                    <span class="material-icons-outlined">shopping_bag</span>
                    <span class="cart-count-badge" style="display: none;">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container product-page">
        <div class="category-header">
            <h1 id="cat-title">Carregando...</h1>
            <p id="cat-count">0 produtos encontrados</p>
        </div>

        <div class="products-grid" id="grid-categoria" style="min-height: 600px;">
        </div>
    </main>

    <footer>
        <p class="copyright">&copy; 2026 MG Mantos. Todos os direitos reservados.</p>
    </footer>

    <div id="cart-modal-overlay" class="modal-overlay" onclick="closeCartModal()"></div>
    <div id="cart-modal" class="modal-box">
        <div class="modal-header">
            <h3 id="modal-title">Seu Carrinho</h3>
            <span class="close-modal" onclick="closeCartModal()">&times;</span>
        </div>
        <div id="modal-cart-items" class="modal-body"></div>
        <div class="modal-footer">
            <div class="modal-total-row">
                <span>Total estimado:</span>
                <span id="modal-total-price">R$ 0,00</span>
            </div>
            <div class="modal-buttons">
                <button onclick="closeCartModal()" class="btn-continue">Continuar Comprando</button>
                <button onclick="finalizeOrder()" class="btn-finalize">Finalizar</button>
            </div>
        </div>
    </div>

    <script src="js/script.js" defer></script>
</body>

</html>
